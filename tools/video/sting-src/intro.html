<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  svg { display: block; width: 100vw; height: 100vh; }

  /* Staggered CSS animations — each group fades/grows in sequence */
  #g-bg   { animation: fdIn  0.5s 0.0s ease both; }
  #g-d1   { animation: fdIn  1.0s 0.2s ease both; }
  #g-d2   { animation: fdIn  1.0s 0.4s ease both; }
  #g-ra   { animation: fdIn  0.8s 0.4s ease both; }
  #g-rb   { animation: fdIn  0.8s 0.55s ease both; }
  #g-circ { animation: grwUp 0.7s 0.5s cubic-bezier(.34,1.3,.64,1) both;
            transform-origin: 261px 671px; transform-box: fill-box; }
  #g-ell  { animation: fdIn  0.6s 0.7s ease both; }
  #g-dot  { animation: fdIn  0.4s 0.8s ease both; }
  #g-poly { animation: fdIn  0.6s 0.3s ease both; }
  #g-logo { animation: fdUp  0.7s 1.1s ease both; }
  #g-text { animation: fdIn  0.8s 1.6s ease both; }

  @keyframes fdIn  { from { opacity: 0 }                           to { opacity: 1 } }
  @keyframes fdUp  { from { opacity: 0; transform: translateY(8px)} to { opacity: 1; transform: none } }
  @keyframes grwUp { from { transform: scale(0) }                  to { transform: scale(1) } }

  /* Replay button — hidden by default, press R or Space */
  #replay {
    position: fixed; bottom: 20px; right: 20px;
    background: rgba(255,255,255,.2); color: white;
    border: 1px solid rgba(255,255,255,.4); border-radius: 6px;
    padding: 6px 16px; font-size: 14px; cursor: pointer;
    font-family: sans-serif; opacity: 0;
    transition: opacity 0.4s 3s; /* fades in after animation completes */
  }
  #replay:hover { background: rgba(255,255,255,.35); }
  body:hover #replay { opacity: 1; }
</style>

<button id="replay" onclick="replay()">Replay (R)</button>

<script>
function replay() {
  var ids = ['g-bg','g-d1','g-d2','g-ra','g-rb','g-circ','g-ell','g-dot','g-poly','g-logo','g-text'];
  ids.forEach(function(id) {
    var el = document.getElementById(id);
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
  });
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'r' || e.key === 'R' || e.key === ' ') replay();
});
// Small delay so font is loaded before animation begins
setTimeout(replay, 300);
</script>
